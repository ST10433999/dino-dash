<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
/* VOICE: playful arcade, a private game for two
   IDEA: the offline-browser runner game turned into a two-lane drag race
   PICTURE: pixel dinos on a ground line racing to a checkered flag
   COLOUR and TYPE: runner grey on off-white (night mode inverted), one blue and one yellow dino; Press Start 2P
   LAYOUT: title + wins, two dino picks; race = status, stacked lanes, big tap pad */
:root{color-scheme:light dark;--bg:light-dark(#f7f7f7,#202124);--ink:light-dark(#535353,#e8eaed);--soft:light-dark(#d6d6d6,#44474b);--blue:#2f7de1;--yel:#f2b705}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 "Press Start 2P",ui-monospace,monospace;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:clamp(18px,4vw,40px) max(4vw,14px) 28px;min-height:100%;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,5.4vw,42px);line-height:1.05;font-weight:400}
.hi{white-space:nowrap;display:flex;gap:16px;align-items:center}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mini{background:transparent;border:2px solid var(--soft);border-radius:4px;min-height:44px;padding:0 12px;cursor:pointer}
.mini:hover{border-color:var(--ink)}
.mini[data-arm]{border-color:#d93025;color:#d93025}
.hi i{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px}
.view{display:flex;flex-direction:column;gap:22px;flex:1}
.view[hidden]{display:none}
.lead{margin:0;font-size:clamp(14px,2.6vw,18px);line-height:1.5}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,3vw,28px)}
.pick{--c:var(--blue);position:relative;background:transparent;border:2px solid var(--soft);border-radius:4px;padding:clamp(18px,4vw,34px) 10px 18px;cursor:pointer;display:grid;gap:18px;justify-items:center;transition:transform .12s,border-color .15s}
.pick[data-who=r]{--c:var(--yel)}
.pick:hover{border-color:var(--c);transform:translateY(-3px)}
.stage{width:100%;display:flex;justify-content:center;border-bottom:2px solid var(--ink)}
.stage svg{width:min(150px,72%);display:block;margin-bottom:-1px}
.nm{border-bottom:4px solid var(--c);padding-bottom:6px;font-size:clamp(13px,2.6vw,18px)}
.here{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:6px;font-size:13px}
.here::before{content:"";width:9px;height:9px;background:#34a853}
.here[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.seg{display:flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;min-height:44px;min-width:60px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.net{margin:0;line-height:1.9;max-width:62ch}
.link{background:transparent;border:2px dashed var(--soft);border-radius:4px;min-height:44px;padding:10px 14px;cursor:pointer;align-self:flex-start;text-align:start;line-height:1.7}
.link:hover{border-color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.msg{text-align:center;min-height:5.2em;display:grid;place-content:center;gap:12px}
.msg b{font-size:clamp(20px,5.2vw,38px);font-weight:400;line-height:1.1;text-wrap:balance}
.msg small{font-size:13px;line-height:1.8;opacity:.8;text-wrap:balance}
.lanes{display:grid;gap:clamp(14px,3vw,26px)}
.lane{--c:var(--blue);--dw:clamp(58px,11vw,96px);transition:opacity .2s}
.lane[data-who=r]{--c:var(--yel)}
.lane.off{opacity:.4}
.lbl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.lbl .nm{font-size:13px;border-bottom-width:3px;padding-bottom:4px}
.tag{opacity:.7}
.ct{margin-left:auto;white-space:nowrap}
.track{position:relative;height:calc(var(--dw) * 19 / 22 + 24px);overflow:hidden}
.track::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:var(--ink)}
.gnd{position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(90deg,var(--ink) 0 4px,transparent 0) calc(var(--s,0px) * -1) 1px/23px 2px repeat-x,linear-gradient(90deg,transparent 0 11px,var(--ink) 0 13px,transparent 0) calc(var(--s,0px) * -1.4) 6px/37px 2px repeat-x}
.dino{position:absolute;bottom:11px;left:calc((100% - var(--dw) - 30px) * var(--p,0));width:var(--dw);transition:left .1s linear;z-index:1}
.dino svg,.flag svg{display:block;width:100%}
.lg{display:none}
.dino[data-f=s] .s,.dino[data-f=a] .a,.dino[data-f=b] .b,.stage .s{display:inline}
.flag{position:absolute;right:2px;bottom:12px;width:24px;color:var(--ink)}
.lane.win .lbl .nm{animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pads{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;margin-top:auto}
.pad{--c:var(--blue);min-height:clamp(100px,19vh,160px);border:0;border-radius:6px;background:var(--c);color:#fff;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 6px 0 rgba(0,0,0,.28);font-size:clamp(16px,4vw,24px);line-height:1.3;transition:transform .05s,box-shadow .05s}
.pad[data-who=r]{--c:var(--yel);color:#2a2100}
.pad:active,.pad.hit{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.pad small{display:block;font-size:13px;margin-top:12px;opacity:.85}
.hint{text-align:center;margin:0;line-height:1.8;opacity:.7}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;color:var(--ink)}
.cloud{position:absolute;left:0;width:96px;opacity:.16;animation:drift 56s linear infinite}
@keyframes drift{from{transform:translateX(105vw)}to{transform:translateX(-140px)}}
@media(max-width:600px){.cloud{width:70px}.hi{gap:10px}}
@media(prefers-reduced-motion:reduce){.cloud,.lane.win .lbl .nm{animation:none}.dino,.pick{transition:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="cloud" style="top:9%;animation-duration:58s;animation-delay:-12s"></div>
  <div class="cloud" style="top:31%;animation-duration:74s;animation-delay:-40s"></div>
  <div class="cloud" style="top:63%;animation-duration:66s;animation-delay:-25s"></div>
</div>
<main>
  <header class="top">
    <h1>DINO DASH</h1>
    <div class="score"><div class="hi" id="hi" aria-label="Wins"></div><button class="mini" id="rst" aria-label="Reset win counter">RESET</button></div>
  </header>

  <section class="view" id="pick">
    <p class="lead">Who's racing? First dino to the flag wins.</p>
    <div class="picks">
      <button class="pick" data-who="m"><span class="here" hidden>HERE</span><div class="stage" data-d="m"></div><span class="nm">MUHAMMED</span></button>
      <button class="pick" data-who="r"><span class="here" hidden>HERE</span><div class="stage" data-d="r"></div><span class="nm">RUMAYSAA</span></button>
    </div>
    <div class="row"><span>Race to</span>
      <div class="seg" id="lim"><button data-l="50">50</button><button data-l="100">100</button><button data-l="200">200</button></div>
      <span>presses</span></div>
    <p class="net" id="net">Connecting to the track…</p>
    <button class="link" id="local">On one device? Race on the same screen →</button>
  </section>

  <section class="view" id="race" hidden>
    <div class="bar"><button class="link" id="back">← Back</button><span id="goal"></span></div>
    <div class="msg" aria-live="polite"><b></b><small></small></div>
    <div class="lanes">
      <div class="lane" data-who="m"><div class="lbl"><span class="nm">MUHAMMED</span><span class="tag"></span><span class="ct"></span></div><div class="track"><div class="dino" data-f="s"></div><div class="flag"></div><div class="gnd"></div></div></div>
      <div class="lane" data-who="r"><div class="lbl"><span class="nm">RUMAYSAA</span><span class="tag"></span><span class="ct"></span></div><div class="track"><div class="dino" data-f="s"></div><div class="flag"></div><div class="gnd"></div></div></div>
    </div>
    <div class="pads" id="pads"></div>
    <p class="hint" id="hint"></p>
  </section>
</main>
<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NAMES={m:'MUHAMMED',r:'RUMAYSAA'}, CAP={m:'Muhammed',r:'Rumaysaa'}, HIS={m:'his',r:'her'};
const COL={m:{X:'#2f7de1',b:'#a9cfff',e:'#ffffff'},r:{X:'#f2b705',b:'#fff0a6',e:'#ffffff'}};
const other=w=>w==='m'?'r':'m';
const LIMITS=[50,100,200];

// --- pixel art (own design) ---
const BODY=[
"...........XXXXXXXX...",
"..........XXXXXXXXXX..",
"..........XXeXXXXXXX..",
"..........XXXXXXXXXX..",
"..........XXXXXXXXXX..",
"..........XXXXXXXXXX..",
"..........XXXXX.......",
"..........XXXXXXXX....",
"....X....XXXXX........",
"X..XXX..XXXXXX........",
"X.XXXXXXXXXXXXXXX.....",
"XXXXXXXXXXXXXXX.X.....",
"XXXXXXXbbbbbXXX.......",
".XXXXXXbbbbbXX........",
"..XXXXXXbbbXX.........",
"...XXXXXXXXX.........."];
const LEGS={s:["....XX...XX","....X.....X","....XX....XX"],a:["....XX...XX","....X.....XX","....XX"],b:["....XX...XX","....XX....X","..........XX"]};
const px=(rows,map,dy=0)=>rows.map((r,y)=>[...r].map((ch,x)=>map[ch]?`<rect x="${x}" y="${y+dy}" width="1.04" height="1.04" fill="${map[ch]}"/>`:'').join('')).join('');
const dino=w=>`<svg viewBox="0 0 22 19" shape-rendering="crispEdges" aria-hidden="true">${px(BODY,COL[w])}${['s','a','b'].map(k=>`<g class="lg ${k}">${px(LEGS[k],{X:COL[w].X},16)}</g>`).join('')}</svg>`;
const FLAG=Array.from({length:14},(_,y)=>'P'+(y<5?[1,2,3,4,5,6,7].map(x=>(x+y)%2?'X':'.').join(''):''));
const flag=`<svg viewBox="0 0 8 14" shape-rendering="crispEdges">${px(FLAG,{P:'currentColor',X:'currentColor'})}</svg>`;
const CLOUD=["......XXXXX.....","....XX.....XX...","..XXX.......XXX.",".X.............X","XXXXXXXXXXXXXXXX"];
const cloud=`<svg viewBox="0 0 16 5" shape-rendering="crispEdges">${px(CLOUD,{X:'currentColor'})}</svg>`;
$$('[data-d]').forEach(el=>el.innerHTML=dino(el.dataset.d));
$$('.cloud').forEach(el=>el.innerHTML=cloud);
const lanes={m:$('.lane[data-who=m]'),r:$('.lane[data-who=r]')};
for(const w of ['m','r']){lanes[w].querySelector('.dino').innerHTML=dino(w);lanes[w].querySelector('.flag').innerHTML=flag}

// --- saved stuff (this device only) ---
let store={};try{store=JSON.parse(localStorage.getItem('dinodash')||'{}')||{}}catch(e){}
const save=()=>{try{localStorage.setItem('dinodash',JSON.stringify(store))}catch(e){}};
const wins=Object.assign({m:0,r:0},store.wins);
let limit=LIMITS.includes(store.limit)?store.limit:100, limitAt=0;
let resetAt=+store.resetAt||0;
function resetWins(at){wins.m=0;wins.r=0;resetAt=at;store.wins=wins;store.resetAt=at;save();drawHi()}
const drawHi=()=>{$('#hi').innerHTML=`<span><i style="background:var(--blue)"></i>M ${String(wins.m).padStart(2,'0')}</span><span><i style="background:var(--yel)"></i>R ${String(wins.r).padStart(2,'0')}</span>`};
const drawLim=()=>{$$('#lim button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===limit));$('#goal').textContent=`RACE TO ${limit}`;draw('m');draw('r')};

// --- state ---
let mode=null, me=null, room=null, opp=null, here={m:false,r:false};
let phase='idle', round=0, winner=null, t0=0, cd='';
let count={m:0,r:0}, fin={m:null,r:null};
const ft={}, timers=[];
const pres=p=>{if(room)room.presence(p).catch(()=>{})};

let ac=null;
function blip(f,d=.09){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function draw(w){
  const L=lanes[w];
  L.style.setProperty('--p',Math.min(1,count[w]/limit));
  L.style.setProperty('--s',count[w]*9+'px');
  L.querySelector('.ct').textContent=`${String(count[w]).padStart(3,'0')}/${limit}`;
}
function step(w){
  const d=lanes[w].querySelector('.dino');
  d.dataset.f=d.dataset.f==='a'?'b':'a';
  clearTimeout(ft[w]);ft[w]=setTimeout(()=>d.dataset.f='s',220);
  draw(w);
}
function reset(){count={m:0,r:0};fin={m:null,r:null};winner=null;draw('m');draw('r');lanes.m.classList.remove('win');lanes.r.classList.remove('win')}

function ui(){
  const O=me?other(me):'r';
  let B='',S='';
  if(phase==='idle'){
    B='PRESS SPACE';
    if(mode==='local')S='Muhammed mashes A · Rumaysaa mashes L · or tap your pad';
    else if(!room)S='Online racing isn’t connected in this view. Go back and race on one screen.';
    else S=opp?`Ready up. The race starts when ${CAP[O]} is ready too`:`${CAP[O]} isn’t on the track yet. Open this page on ${HIS[O]} device`;
  }else if(phase==='ready'){B='READY!';S=opp?`Waiting for ${CAP[O]}…`:`Waiting for ${CAP[O]} to join…`}
  else if(phase==='count'){B=cd;S='Get set…'}
  else if(phase==='race'){B='GO!';S=mode==='local'?'Mash your key!':'Mash SPACE or tap!'}
  else if(phase==='done'){B=`${NAMES[winner]} WINS!`;S=`${(fin[winner]/1000).toFixed(2)}s to ${limit} · press SPACE or tap to race again`}
  $('.msg b').textContent=B;$('.msg small').textContent=S;
  for(const w of ['m','r']){
    let t='';
    if(mode==='local')t=w==='m'?'KEY A':'KEY L';
    else if(w===me)t='YOU';
    else t=!opp?'NOT HERE':(opp.presence.st==='ready'&&opp.presence.round>=round&&phase!=='race'?'READY':'HERE');
    lanes[w].querySelector('.tag').textContent=t;
    lanes[w].classList.toggle('off',mode==='net'&&w!==me&&!opp);
    lanes[w].classList.toggle('win',phase==='done'&&winner===w);
  }
  $$('.pad').forEach(p=>{
    const w=p.dataset.who;
    const top=mode==='local'?NAMES[w]:({idle:'READY',done:'AGAIN',ready:'WAITING…',count:'GET SET',race:'TAP!'})[phase];
    const sub=mode==='local'?(phase==='race'?'TAP! TAP!':(phase==='count'?'GET SET':'TAP TO START')):'or press SPACE';
    p.innerHTML=`${top}<small>${sub}</small>`;
  });
  $('#hint').textContent=mode==='local'?'Space starts the race. Holding a key down does not count.':'Holding the key down does not count. One press = one step.';
}

function countdown(){
  phase='count';
  if(mode==='net')pres({st:'race'});
  const seq=[['3',0,440],['2',1000,440],['1',2000,440]];
  seq.forEach(([n,t,f])=>timers.push(setTimeout(()=>{cd=n;blip(f);ui()},t)));
  timers.push(setTimeout(()=>{phase='race';t0=performance.now();blip(880,.18);ui()},3000));
}
function ready(){
  blip(330,.05);
  if(mode==='local'){reset();countdown();return}
  const o=opp&&opp.presence, oR=o?(+o.round|0):0;
  round=(o&&o.st==='ready'&&oR>round)?oR:Math.max(round,oR)+1;
  reset();phase='ready';
  pres({st:'ready',round,count:0,fin:null,limit,limitAt});
  ui();check();
}
function check(){
  if(mode!=='net'||phase!=='ready'||!opp)return;
  const o=opp.presence;
  if(o.round===round&&(o.st==='ready'||o.st==='race'))countdown();
}
function press(w){
  if(phase!=='race'||fin[w]!=null)return;
  count[w]++;step(w);
  if(mode==='net')pres({count:count[w]});
  if(count[w]>=limit){
    fin[w]=performance.now()-t0;
    if(mode==='net')pres({fin:Math.round(fin[w])});
    decide();
  }
}
function decide(){
  const a=fin.m,b=fin.r;if(a==null&&b==null)return;
  const w=b==null?'m':a==null?'r':(a<=b?'m':'r');
  if(phase!=='done'){phase='done';winner=w;wins[w]++;[523,659,784].forEach((f,i)=>setTimeout(()=>blip(f,.12),i*130))}
  else if(w!==winner){wins[winner]--;wins[w]++;winner=w}
  else return;
  store.wins=wins;save();drawHi();ui();
}
function act(w){
  if(phase==='race')press(w);
  else if(phase==='idle'||phase==='done')ready();
}

// --- screens ---
function enter(m,w){
  mode=m;me=w;phase='idle';round=round||0;reset();
  $('#pick').hidden=true;$('#race').hidden=false;
  $('#pads').innerHTML=(m==='local'?['m','r']:[w]).map(x=>`<button class="pad" data-who="${x}"></button>`).join('');
  $$('.pad').forEach(p=>{
    p.addEventListener('pointerdown',e=>{e.preventDefault();p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),60);act(mode==='local'?p.dataset.who:me)});
    p.addEventListener('click',e=>{if(e.detail===0)act(mode==='local'?p.dataset.who:me)});
  });
  if(m==='net')pres({who:w,st:'idle',round,count:0,fin:null,limit,limitAt,resetAt});
  if(document.activeElement)document.activeElement.blur();
  peersChanged();ui();
}
function back(){
  timers.splice(0).forEach(clearTimeout);
  if(mode==='net')pres({who:null,st:'idle'});
  mode=null;me=null;opp=null;phase='idle';
  $('#race').hidden=true;$('#pick').hidden=false;
  peersChanged();
}
$$('.pick').forEach(b=>b.addEventListener('click',()=>enter('net',b.dataset.who)));
$('#local').addEventListener('click',()=>enter('local',null));
// two-tap reset: RESET → SURE? → cleared (on both phones when online)
$('#rst').addEventListener('click',()=>{
  const b=$('#rst');
  if(b.dataset.arm){delete b.dataset.arm;b.textContent='RESET';resetWins(Date.now());pres({resetAt});blip(220,.12)}
  else{b.dataset.arm='1';b.textContent='SURE?';setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent='RESET'}},3000)}
});
$('#back').addEventListener('click',back);
$$('#lim button').forEach(b=>b.addEventListener('click',()=>{limit=+b.dataset.l;limitAt=Date.now();store.limit=limit;save();drawLim();pres({limit,limitAt})}));

addEventListener('keydown',e=>{
  if($('#race').hidden)return;
  if(e.code==='Space'){
    e.preventDefault();if(e.repeat)return;
    if(mode==='net')act(me);
    else if(phase==='idle'||phase==='done')ready();
  }else if(e.code==='Escape')back();
  else if(mode==='local'&&!e.repeat){
    if(e.code==='KeyA')press('m');
    else if(e.code==='KeyL')press('r');
  }
});
addEventListener('keyup',e=>{if(e.code==='Space'&&!$('#race').hidden)e.preventDefault()});

// --- online room ---
function netLine(){
  const el=$('#net');
  if(!room){el.textContent='Couldn’t reach the online track. Check your connection, or race on one screen below.';return}
  if(!room.connected()){el.textContent='Connecting to the track…';return}
  const on=['m','r'].filter(w=>here[w]).map(w=>CAP[w]);
  el.textContent=on.length?`Online now: ${on.join(' & ')}. Pick your dino on your own phone.`:'Online. Open this link on both phones and each pick your dino.';
}
function peersChanged(){
  const all=room?room.peers():[];
  const others=all.filter(p=>!p.sameTab&&p.kind==='viewer'&&p.presence&&(p.presence.who==='m'||p.presence.who==='r'));
  here={m:others.some(p=>p.presence.who==='m'),r:others.some(p=>p.presence.who==='r')};
  $$('.pick').forEach(b=>b.querySelector('.here').hidden=!here[b.dataset.who]);
  // follow the newest race length chosen by anyone
  if(phase!=='count'&&phase!=='race')for(const p of others){const o=p.presence;if(LIMITS.includes(o.limit)&&+o.limitAt>limitAt){limit=o.limit;limitAt=+o.limitAt;drawLim()}}
  for(const p of others){const r=+p.presence.resetAt||0;if(r>resetAt&&r<Date.now()+60000)resetWins(r)}
  netLine();
  if(mode!=='net'||!me){opp=null;return}
  const O=other(me);
  opp=others.filter(p=>p.presence.who===O).sort((a,b)=>b.updatedAt-a.updatedAt)[0]||null;
  if(opp){
    const o=opp.presence;
    if(o.round===round&&phase!=='idle'){
      const c=Math.max(0,Math.min(limit,+o.count|0));
      if(c>count[O]){count[O]=c;step(O)}else if(c!==count[O]){count[O]=c;draw(O)}
      const f=typeof o.fin==='number'&&o.fin>0&&o.fin<1e7?o.fin:null;
      if(f!==fin[O]&&(phase==='race'||phase==='done'||phase==='count')){fin[O]=f;decide()}
    }
  }
  ui();check();
}
// Live sync through a public MQTT broker: each device keeps one retained "presence" message,
// cleared by its last-will when it disconnects. Same shape as the presence API the game uses.
function mqttRoom(){
  if(!window.mqtt)return null;
  const CH=(location.hash.slice(1).replace(/[^a-z0-9-]/gi,'')||'9e04b1d4607e').toLowerCase();
  const base='dinodash-mr/'+CH, id=Math.random().toString(36).slice(2,12), mine=`${base}/p/${id}`;
  const st={}, map=new Map(), subs=[], conns=[];
  let conn=false, snap=Object.freeze([]);
  const client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'dd_'+id,clean:true,keepalive:15,reconnectPeriod:2000,connectTimeout:10000,will:{topic:mine,payload:'',retain:true,qos:0}});
  const rebuild=()=>{const now=Date.now();for(const[k,p]of map)if(now-p.seen>13000)map.delete(k);snap=Object.freeze([...map.values()]);subs.forEach(f=>f({peers:snap}))};
  const send=()=>{if(conn)client.publish(mine,JSON.stringify({p:st,ts:Date.now()}),{retain:true,qos:0})};
  const setConn=c=>{if(c!==conn){conn=c;conns.forEach(f=>f(c))}};
  client.on('connect',()=>{setConn(true);client.subscribe(`${base}/p/+`);send()});
  client.on('close',()=>setConn(false));client.on('offline',()=>setConn(false));client.on('error',()=>{});
  client.on('message',(t,buf)=>{
    const pid=t.slice(t.lastIndexOf('/')+1);if(pid===id)return;
    const s=buf.toString();
    if(!s){if(map.delete(pid))rebuild();return}
    try{const o=JSON.parse(s);if(!o||typeof o.p!=='object'||Date.now()-(+o.ts||0)>60000)return;
      map.set(pid,{peer:pid,sameTab:false,isMe:false,kind:'viewer',presence:o.p,updatedAt:Date.now(),seen:Date.now()});rebuild()}catch(e){}
  });
  setInterval(()=>{send();rebuild()},4000);
  addEventListener('pagehide',()=>{try{client.publish(mine,'',{retain:true,qos:0});client.end(true)}catch(e){}});
  return{
    presence(patch){for(const k in patch){if(patch[k]===null)delete st[k];else st[k]=patch[k]}send();return Promise.resolve()},
    peers:()=>snap,
    onPeers(f){subs.push(f);setTimeout(()=>f({peers:snap}),0)},
    onConnection(f){conns.push(f);setTimeout(()=>f(conn),0)},
    connected:()=>conn
  };
}
(()=>{
  try{room=mqttRoom()}catch(e){room=null}
  if(!room){netLine();return}
  room.onPeers(()=>peersChanged(),()=>{room=null;netLine();if(mode)ui()});
  room.onConnection(()=>netLine());
  netLine();
})();

drawHi();drawLim();netLine();
}
